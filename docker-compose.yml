services:
  db:
    image: postgres:16-alpine
    container_name: juris-221-db
    environment:
      POSTGRES_DB: jurist221
      POSTGRES_USER: jurist221
      POSTGRES_PASSWORD: jurist221
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jurist221 -d jurist221"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: juris-221-api
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 10000
      DATABASE_URL: postgresql://jurist221:jurist221@db:5432/jurist221?schema=public
    ports:
      - "5000:10000"
    restart: unless-stopped

volumes:
  postgres-data:
